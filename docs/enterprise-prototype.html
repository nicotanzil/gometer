function heading(title,subtitle,actions=''){return `<div class="page-head"><div class="title-block"><div class="row"><h1>${esc(title)}</h1>${state.view==='build'?`<span class="status ${state.saved?'good':''}" id="draft-state">${state.saved?'Saved':'Draft'}</span>`:''}</div>${subtitle?`<div class="subline">${subtitle}</div>`:''}</div><div class="head-actions">${actions}</div></div>`}
function builder(){return `${heading(state.name,`${state.nodes.length} steps · 1 journey`,`<button class="btn quiet" data-action="import" aria-label="Import test">${icon('upload')}<span class="import-label">Import</span></button><button class="btn" data-action="validate">${icon('check')}Validate</button><button class="btn" data-action="save" aria-label="Save scenario">${icon('save')}<span class="save-label">Save</span></button><button class="btn primary" data-action="start"><span class="start-icon">${icon('play')}</span>Start run</button>`)}<nav class="main-tabs" aria-label="Test editor"><button data-tab="settings" class="${state.tab==='settings'?'active':''}" aria-current="${state.tab==='settings'?'page':'false'}">Settings</button><button data-tab="journey" class="${state.tab==='journey'?'active':''}" aria-current="${state.tab==='journey'?'page':'false'}">Journey<span class="tab-count">${state.nodes.length}</span></button><button data-tab="json" class="${state.tab==='json'?'active':''}" aria-current="${state.tab==='json'?'page':'false'}">JSON</button><span class="spacer"></span><span class="tab-meta row small muted">${icon('server')}Local execution</span></nav><div class="validation-slot" id="validation-slot">${state.validationShown?validationMessage():''}</div>${state.tab==='settings'?settings():state.tab==='journey'?journey():jsonView()}`}
function settings(){return `<div class="builder-layout"><nav class="section-index" aria-label="Configuration sections">${['Target','Traffic','Checks','Execution'].map((v,i)=>`<button class="${i===0?'active':''}" data-scroll="section-${v.toLowerCase()}">${v}</button>`).join('')}</nav><div class="editor"><section class="form-section scroll-target" id="section-target"><div class="section-head"><h2>Target</h2><button class="btn quiet small" data-tab="journey">Edit journey ${icon('arrow')}</button></div><div class="fields one">${field('Test name','name',state.name)}${field('Base URL','url',state.url,'','text','base')}</div><div class="endpoint">${icon('branch')}<span>Checkout</span><span class="spacer"></span><span class="mono">${state.nodes.length} steps</span></div><details class="details"><summary>Request defaults<span class="count">1 header</span></summary><div class="fields two"><label class="field"><span>Header</span><input value="Content-Type" class="mono" aria-label="Default header name"></label><label class="field"><span>Value</span><input value="application/json" class="mono" aria-label="Default header value"></label>${field('Timeout','timeout',5,'s','number')}<label class="field"><span>TLS</span><select aria-label="TLS verification"><option>Verify certificates</option><option>Skip verification</option></select></label></div></details></section><section class="form-section scroll-target" id="section-traffic"><div class="section-head"><h2>Traffic</h2>${tip('rate','About traffic models')}</div><div class="mode-choice" aria-label="Traffic model"><button data-mode="rate" class="${state.mode==='rate'?'active':''}" aria-pressed="${state.mode==='rate'}">Arrival rate</button><button data-mode="users" class="${state.mode==='users'?'active':''}" aria-pressed="${state.mode==='users'}">Concurrent users</button></div><div class="fields">${state.mode==='rate'?field('Arrival rate','rate',state.rate,'/s','number','rate'):field('Users','users',state.users,'','number')}${field('Duration','duration',state.duration,'s','number','duration')}${state.mode==='rate'?field('In-flight cap','cap',state.cap,'','number','cap'):field('Iterations','iterations',5,'/user','number')}</div><details class="details"><summary>Traffic options</summary><div class="fields two">${field('Ramp-up','ramp',0,'s','number')}${field('Start delay','delay',0,'s','number')}<label class="field full"><span>On request failure</span><select aria-label="Request failure action"><option>Next iteration</option><option>Continue journey</option><option>Stop user</option><option>Stop test</option><option>Stop immediately</option></select></label></div><button class="btn quiet small" data-action="phases" style="margin-top:12px">${icon('plus')}Add phase</button></details></section><section class="form-section scroll-target" id="section-checks"><div class="section-head"><h2>Pass criteria</h2><button class="btn quiet small" data-action="checks">${icon('plus')}Add check</button></div>${[['HTTP latency · p95','latency','p95','ms','≤'],['HTTP errors','error','errors','%','≤'],['Missed arrivals','missed','missed','%','≤']].map(([label,key,help,unit,op])=>`<div class="check-row"><div class="check-label">${label}${tip(help,`About ${label}`)}</div><span class="muted">${op}</span><label class="field"><span class="input-unit"><input aria-label="${label} limit" data-field="${key}" type="number" min="0" step="any" value="${state[key]}"><span class="unit">${unit}</span></span></label></div>`).join('')}</section><section class="form-section scroll-target" id="section-execution"><details class="details" style="margin:0;border:0"><summary style="padding:0">Execution<span class="count">Local</span></summary><div class="fields one"><label class="field"><span>Workers</span><textarea placeholder="https://worker-1.internal:8090" aria-label="Worker origins"></textarea></label><div class="quiet-note">Remote workers support arrival-rate tests.</div></div></details><details class="details"><summary>Telemetry<span class="count">Off</span></summary>${field('Exporter URL','exporter','','','url')}<button class="btn quiet small" data-action="context-help" style="margin-top:9px">Exporter setup ${icon('arrow')}</button></details></section></div><aside class="settings-aside">${plan()}<div class="saved-block"><div class="row spread"><h3>Saved tests</h3>${ib('plus','new','New test')}</div>${['API baseline','Checkout ramp'].map((n,i)=>`<button class="saved-test" data-preset="${n}">${icon('file')}${n}<small>${i?'Yesterday':'Today'}</small></button>`).join('')}<button class="saved-test" data-action="migrations">${icon('folder')}Migration drafts<small>2</small></button></div></aside></div>`}
function plan(){const arrivals=state.rate*state.duration;return `<section class="plan" aria-label="Traffic plan"><div class="plan-header"><h3>Traffic plan</h3>${tip('plan','About this estimate')}</div><div class="plan-body"><div class="plan-rate" id="plan-rate">${state.mode==='rate'?`${state.rate}<small>journeys/s</small>`:`${state.users}<small>users</small>`}</div><div class="plan-chart"><svg viewBox="0 0 220 55" aria-label="Flat traffic schedule" role="img"><path d="M0 47H220" stroke="var(--line)"/><path d="M3 45V15H216V45" fill="none" stroke="var(--blue)" stroke-width="1.8"/><path d="M3 15H216V45H3Z" fill="var(--blue-bg)"/><path d="M3 15H216" stroke="var(--blue)" stroke-width="1.8"/><text x="3" y="55" fill="var(--muted)" font-size="9" font-family="monospace">0s</text><text x="194" y="55" fill="var(--muted)" font-size="9" font-family="monospace">${state.duration}s</text></svg></div><div class="definition"><span>Duration</span><strong id="plan-duration">${state.duration}s</strong></div><div class="definition"><span>${state.mode==='rate'?'Planned arrivals':'User limit'}</span><strong id="plan-arrivals">${state.mode==='rate'?`${arrivals.toLocaleString()} journeys`:`${state.users} concurrent`}</strong></div><div class="definition"><span>HTTP steps</span><strong>${state.nodes.length} / journey</strong></div><div class="definition"><span>Execution</span><strong>Local</strong></div></div><div class="plan-footer"><span class="status ${state.valid?'good':''}" id="plan-validation">${state.valid?'Validated':'Not validated'}</span><button class="help" data-action="context-help" aria-label="Traffic plan help">${icon('help')}</button></div></section>`}
function journey(){const selected=state.nodes[state.selected];return `<section class="canvas-shell ${state.full?'is-fullscreen':''}" aria-label="Journey canvas"><div class="canvas-toolbar"><span class="canvas-mobile-tabs"><button class="${!state.mobileInspector?'active':''}" data-canvas-pane="canvas">Canvas</button><button class="${state.mobileInspector?'active':''}" data-canvas-pane="inspector">Inspector</button></span><label class="check"><input type="checkbox" id="data-flow" ${state.dataFlow?'checked':''}><span class="data-flow-label">Data flow</span></label>${tip('data','About data flow')}<span class="spacer"></span><span class="toolbar-label muted small">Checkout</span><span class="separator"></span>${ib('undo','undo','Undo',state.undo.length?'':'disabled')}${ib('minus','zoom-out','Zoom out')}<span class="zoom-percent mono small muted">${state.zoom}%</span>${ib('plus','zoom-in','Zoom in')}<button class="btn quiet small" data-action="fit">Fit</button>${ib('expand','fullscreen',state.full?'Exit full screen':'Full screen')}</div><div class="canvas-layout ${state.mobileInspector?'show-inspector':''}"><aside class="outline"><h3>Journey</h3><div class="journey-name">Checkout<span class="small">100%</span></div><h3>Flow outline</h3>${state.nodes.map((n,i)=>`<button class="outline-step ${i===state.selected?'active':''}" data-node="${i}"><span class="index">${String(i+1).padStart(2,'0')}</span>${esc(n.name)}</button>`).join('')}<div class="outline-add">${[['plus','request','Request'],['branch','branch','Branch'],['loop','loop','Loop'],['pause','pause','Think time']].map(([ic,action,label])=>`<button data-action="add-${action}">${icon(ic)}${label}</button>`).join('')}</div><button class="btn quiet small" data-action="journey-data" style="margin-top:18px">${icon('more')}Data & settings</button></aside><div class="graph" id="graph" aria-label="Flow canvas; drag background to pan"><div class="graph-content" style="transform:translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom/100})"><div class="flow-cap"><i class="dot"></i>Journey start</div><div class="flow-link"></div>${state.nodes.map((n,i)=>`<button class="flow-node ${i===state.selected?'selected':''}" data-node="${i}" aria-label="Edit ${esc(n.name)}"><div class="node-heading"><span>${esc(n.name)}</span><span class="node-index">${String(i+1).padStart(2,'0')}</span></div><div class="node-path"><span class="method">${n.method}</span>${esc(n.path)}</div><div class="node-meta"><span>${n.checks} checks</span><span class="extracted">${esc(n.extract)}</span></div></button><div class="flow-link"></div>`).join('')}<div class="flow-cap"><i class="dot"></i>Journey end</div>${state.dataFlow?'<svg class="data-edges" viewBox="0 0 370 510" aria-hidden="true"><path d="M68 108C7 108 7 230 68 230M68 108C-11 108 -11 352 68 352"/></svg>':''}</div></div><aside class="canvas-inspector" aria-label="Request inspector"><div class="inspector-heading"><span>${esc(selected.name)}</span><span class="tag">${String(state.selected+1).padStart(2,'0')}</span></div><nav class="mini-tabs" aria-label="Inspector">${['request','checks','variables'].map(t=>`<button data-inspector="${t}" class="${state.inspectorTab===t?'active':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav><div class="inspector-body">${inspector(selected)}</div><div class="inspector-actions">${ib('up','move-up','Move step up',state.selected===0?'disabled':'')}${ib('down','move-down','Move step down',state.selected===state.nodes.length-1?'disabled':'')}<span class="spacer"></span><button class="btn quiet small" data-action="preview-sequence">Preview ${icon('play')}</button></div></aside></div><footer class="canvas-footer"><span class="row"><i class="line-key"></i>Execution<span class="row data-key-label"><i class="line-key dotted"></i>Data</span></span><span class="canvas-hint">Drag to pan</span><span class="small">${state.nodes.length} nodes · 1 journey</span></footer></section><details class="canvas-settings" id="journey-data"><summary>Journey settings & data</summary><div class="fields">${field('Journey name','journey-name','Checkout')}${field('Weight','weight',100,'%','number','weight')}${field('Timeout','journey-timeout',5,'s','number')}<label class="field full"><span>Variables</span><textarea class="mono" aria-label="Journey variables">username = demo\nitem = starter</textarea></label></div><div class="row" style="margin-top:14px"><button class="btn small" data-action="csv">${icon('upload')}Import CSV</button><span class="muted small">Local concurrent-user journeys</span></div></details>`}
function inspector(n){if(state.inspectorTab==='checks')return `<div class="section-head"><h3>Response checks</h3>${tip('errors','About response checks')}</div><label class="field"><span>Status codes</span><input value="200" aria-label="Expected status codes"></label><label class="field"><span>JSON Pointer</span><input value="/authenticated" class="mono" aria-label="JSON Pointer check"></label><label class="field"><span>Expected value</span><input value="true" class="mono" aria-label="Expected JSON value"></label><button class="btn small" data-action="checks">${icon('plus')}Add check</button>`;if(state.inspectorTab==='variables')return `<div class="section-head"><h3>Extract values</h3>${tip('token','About extracted variables')}</div><div class="fields one"><label class="field"><span>Variable</span><input value="token" class="mono" aria-label="Extraction variable"></label><label class="field"><span>JSON Pointer</span><input value="/token" class="mono" aria-label="Extraction JSON Pointer"></label></div><div class="details"><summary style="cursor:default">Available before step</summary><div class="row wrap" style="margin-top:12px"><span class="tag">username</span><span class="tag">item</span>${state.selected>0?'<span class="tag">token</span>':''}</div></div>`;return `<label class="field"><span>Step name</span><input data-node-field="name" value="${esc(n.name)}"></label><div class="fields two"><label class="field"><span>Method</span><select data-node-field="method">${['GET','POST','PUT','PATCH','DELETE','IF','LOOP'].map(m=>`<option ${n.method===m?'selected':''}>${m}</option>`).join('')}</select></label><label class="field"><span>Pause</span><span class="input-unit"><input value="0" type="number" aria-label="Pause after success"><span class="unit">ms</span></span></label></div><label class="field"><span>Request path</span><input data-node-field="path" value="${esc(n.path)}" class="mono"></label><details class="details" open><summary>Headers<span class="count">1</span></summary><label class="field"><span class="hidden">Content-Type header</span><input value="application/json" aria-label="Content-Type header value" class="mono"></label></details><label class="field" style="margin-top:18px"><span>Body</span><textarea data-node-field="body" spellcheck="false">${esc(n.body)}</textarea></label>`}
function configuration(){return {name:state.name,url:state.url,mode:state.mode,...(state.mode==='rate'?{rate:Number(state.rate),max_in_flight:Number(state.cap)}:{vus:Number(state.users)}),duration:`${state.duration}s`,thresholds:{p95:`${state.latency}ms`,max_error_percent:Number(state.error),max_drop_percent:Number(state.missed)},scenarios:[{name:'Checkout',weight:100,data:[{username:'demo',item:'starter'}],steps:state.nodes.map(n=>({name:n.name,method:n.method,path:n.path,...(n.body?{body:n.body}:{})}))}]}}
function jsonView(){return `<div class="json-layout"><textarea class="json-editor" aria-label="Scenario JSON" spellcheck="false" id="scenario-json">${esc(JSON.stringify(configuration(),null,2))}</textarea><aside class="json-note"><h3>Scenario JSON</h3><p>The dashboard and CLI use the same configuration.</p><button class="btn small" data-action="download-json">${icon('download')}Export JSON</button><p class="quiet-note">This prototype previews JSON. Use Settings or Journey to edit the sample.</p></aside></div>`}
function metric(label,value,unit,foot,kind='',help=''){return `<div class="metric"><div class="metric-label">${label}${help?tip(help,`About ${label}`):''}</div><div class="metric-value">${value}<small>${unit}</small></div><div class="metric-foot ${kind}">${foot}</div></div>`}
function chart(title,type){const isTraffic=type==='traffic';const points=isTraffic?'48,87 65,83 80,85 95,82 110,84 125,81 140,84 155,82 170,87 185,82 200,84 215,81 230,85 245,82 260,81 275,83 290,86 305,82 320,85 335,81 350,84 365,82 380,85 395,82 410,83 425,81 440,84':'48,114 65,106 80,109 95,101 110,112 125,97 140,102 155,110 170,100 185,108 200,94 215,104 230,98 245,109 260,100 275,90 290,105 305,97 320,108 335,93 350,101 365,98 380,106 395,97 410,110 425,100 440,103';return `<section class="chart-panel"><div class="chart-heading"><span>${title}</span><span class="small">${isTraffic?'journeys/s':'ms'}</span></div><svg class="chart" viewBox="0 0 480 210" role="img" aria-label="${title}, illustrative sample data"><path class="grid" d="M48 40H448M48 80H448M48 120H448M48 160H448"/><text x="12" y="44">${isTraffic?'150':'300'}</text><text x="12" y="84">${isTraffic?'100':'200'}</text><text x="19" y="124">${isTraffic?'50':'100'}</text><text x="26" y="164">0</text><text x="43" y="190">0s</text><text x="166" y="190">10s</text><text x="297" y="190">20s</text><text x="429" y="190">30s</text>${isTraffic?'<path class="reference" d="M48 80H440"/>':'<path class="threshold-line" d="M48 80H440"/>'}<polyline class="trace" points="${points}"/></svg><div class="chart-legend"><span><i></i>${isTraffic?'Started':'HTTP p95'}</span><span><i class="gray"></i>${isTraffic?'Scheduled':'200 ms limit'}</span></div></section>`}
function live(){return `${heading(state.name,'Run #1042 · Local · Sample results',`<button class="btn" data-action="export-results">${icon('download')}Export</button>${state.running?`<button class="btn danger" data-action="stop">${icon('stop')}Stop</button>`:`<button class="btn" data-action="edit-test">${icon('build')}Edit test</button><button class="btn primary" data-action="start">${icon('play')}Run again</button>`}`)}<div class="run-strip"><span class="status ${state.running?'blue':'good'}">${state.running?'Running':'Passed'}</span><span class="mono" id="run-time">${state.running?state.elapsed+' / 30s':'30 / 30s'}</span><div class="progress"><span id="run-progress" style="width:${state.running?state.elapsed/30*100:100}%"></span></div><span class="spacer"></span><span class="run-strip-extra">Checkout · ${state.nodes.length} steps</span><span class="mono small">${esc(state.url)}</span></div><div class="metric-grid">${metric('Journey arrivals','100','/s','Scheduled demand','','journeys')}${metric('HTTP throughput','300','/s','3 steps per journey','','journeys')}${metric('HTTP latency · p95','142','ms','Limit ≤ 200 ms','good','latency')}${metric('HTTP errors','0.0','%','0 failed attempts','good','errors')}${metric('Missed arrivals','0.0','%','All arrivals started','good','missed')}${metric('Completed journeys','3,000','','9,000 HTTP attempts','','journeys')}</div><div class="chart-grid">${chart('Journey arrivals','traffic')}${chart('Response latency','latency')}</div><section class="tabs-section"><nav class="main-tabs" aria-label="Result details">${['Checks','Requests','Generator','Workers','Telemetry'].map(t=>`<button data-detail-tab="${t}" class="${state.detailTab===t?'active':''}">${t}</button>`).join('')}</nav>${resultDetail()}</section>`}
function resultDetail(){const groups={Checks:[['HTTP p95','142 ms / 200 ms'],['HTTP errors','0% / 1%'],['Missed arrivals','0% / 0%'],['Verdict','All checks passed']],Requests:[['Login','POST /login'],['Profile','GET /profile'],['Checkout','POST /checkout'],['HTTP attempts','9,000 completed']],Generator:[['Process CPU','8.2%'],['Go memory','24.8 MiB'],['Arrival delay · p95','0.8 ms'],['Connection reuse','99.4%']],Workers:[['Execution','Local'],['Workers','None configured'],['Result coverage','Complete'],['Mode','Arrival rate']],Telemetry:[['Collection','Off'],['Exporter','Not configured'],['CPU','Not collected'],['Memory','Not collected']]};return `<div class="detail-grid">${groups[state.detailTab].map(([k,v])=>`<div><div class="detail-name">${k}</div><strong>${v}</strong></div>`).join('')}</div>`}
function history(){const shown=runs.map((r,i)=>({...r,i})).filter(r=>r.name.toLowerCase().includes(state.search.toLowerCase())&&(state.filter==='all'||r.status.toLowerCase()===state.filter));return `${heading('Run history','6 runs · Local workspace',`<button class="btn" data-action="import-run">${icon('upload')}Import run</button>`)}<div class="table-toolbar"><div class="search-wrap">${icon('search')}<input class="search-input" id="history-search" placeholder="Find a run…" aria-label="Find a run" value="${esc(state.search)}"></div><select id="status-filter" class="standalone-select" aria-label="Filter by status">${[['all','All statuses'],['passed','Passed'],['failed','Failed'],['stopped','Stopped']].map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select><span class="spacer"></span><button class="btn" data-action="compare" ${state.selectedRuns.length!==2?'disabled':''}>${icon('compare')}Compare${state.selectedRuns.length?' ('+state.selectedRuns.length+'/2)':''}</button></div><div class="table-panel"><div class="table-scroll"><table><thead><tr><th style="width:35px"><span class="muted" data-tip="Select two runs to compare">${icon('compare')}</span></th><th>Test</th><th>Status</th><th>Started</th><th class="num">Rate /s</th><th class="num">p95 · ms</th><th class="num">Errors %</th><th class="num">Missed %</th><th>Duration</th><th></th></tr></thead><tbody>${shown.map(r=>`<tr><td><input type="checkbox" data-run-select="${r.i}" aria-label="Select ${r.name}, ${r.time}" ${state.selectedRuns.includes(r.i)?'checked':''}></td><td class="name-cell" data-run="${r.i}"><button data-run="${r.i}" style="padding:0;font-weight:550;text-align:left">${r.name}</button></td><td><span class="status ${r.status==='Passed'?'good':r.status==='Failed'?'bad':''}">${r.status}</span></td><td>${r.time}</td><td class="num mono">${r.rate}</td><td class="num mono">${r.p95}</td><td class="num mono">${r.error}</td><td class="num mono">${r.missed}</td><td class="mono">${r.duration}</td><td>${ib('download','export-results','Export run')}</td></tr>`).join('')}</tbody></table>${shown.length?'':'<div class="empty">No matching runs.</div>'}</div><footer class="table-footer"><span>${shown.length} of ${runs.length} runs</span><span>Select two runs to compare</span></footer></div>${state.compared&&state.selectedRuns.length===2?compare():''}`}
function compare(){const a=runs[state.selectedRuns[0]],b=runs[state.selectedRuns[1]];return `<section class="compare-panel"><div class="row spread"><h2>Run comparison</h2><button class="icon-btn" data-action="close-compare" aria-label="Close comparison">${icon('close')}</button></div><div class="compare-values"><div><p>HTTP p95</p><strong>${a.p95} → ${b.p95}<small class="muted"> ms</small></strong></div><div><p>HTTP errors</p><strong>${a.error} → ${b.error}<small class="muted"> %</small></strong></div><div><p>Missed arrivals</p><strong>${a.missed} → ${b.missed}<small class="muted"> %</small></strong></div></div></section>`}
const guideArticles={
'First test':`<h2>Your first test</h2><p>Start with a small workload against the bundled demo.</p><h3>1. Start the demo</h3><pre class="code-block">./bin/gometer-demo</pre><h3>2. Configure traffic</h3><p>Use the local demo target, choose an arrival rate or concurrent users, then set the duration and acceptance checks.</p><h3>3. Validate and run</h3><p>Validation sends no workload traffic. Start the run explicitly, then review errors, latency, missed arrivals, and the final verdict together.</p><button class="btn primary" data-action="edit-test">Open builder ${icon('arrow')}</button>`,
'Traffic models':`<h2>Traffic models</h2><h3>Arrival rate</h3><p>Schedule new request or journey arrivals independently of response time. If the generator cannot start work, GoMeter records the missed demand.</p><h3>Concurrent users</h3><p>Each user repeats requests or journeys independently. Configure duration, iterations, ramp-up, and startup delay.</p><h3>Units matter</h3><p>One journey can produce several HTTP attempts. Compare journey arrivals with journey arrivals, and request throughput with request throughput.</p>`,
'Journey canvas':`<h2>Journey canvas</h2><p>The canvas keeps the current outline, vertical execution flow, and request inspector.</p><ul><li>Select a node to edit its request, checks, and extracted variables.</li><li>Solid arrows show execution. Dotted links show data dependencies.</li><li>Branches select a path. Loops repeat their child steps.</li><li>Use the outline or inspector controls to reorder steps.</li><li>Pan, zoom, fit, and full screen support larger journeys.</li></ul><button class="btn" data-tab="journey">Open canvas ${icon('arrow')}</button>`,
'Results':`<h2>Read a run</h2><p>A passed run completed with all configured checks satisfied. Review the measurements together.</p><h3>Latency</h3><p>Latency includes the response body and completed failed attempts. Percentiles are histogram estimates.</p><h3>Missed arrivals</h3><p>Missed arrivals never started and have no response-latency sample. Fast responses alone do not prove that the planned load was delivered.</p><h3>Unknown data</h3><p>Missing telemetry and incomplete worker results remain unknown. They are not displayed as zero.</p>`,
'Workers & data':`<h2>Workers & data</h2><h3>Distributed execution</h3><p>Add authenticated workers under Execution. Distributed runs currently support arrival-rate mode.</p><h3>CSV data</h3><p>Import CSV under Journey settings & data. Map columns to variables and choose shared or per-user rows. CSV allocation currently supports local concurrent-user journeys.</p><h3>Remote access</h3><p>The dashboard is single-user and local by default. Remote access requires a private authenticated ingress.</p>`};
function guide(){return `${heading('Guide','Reference when you need it')}<div class="guide-grid"><nav class="guide-nav" aria-label="Guide topics">${Object.keys(guideArticles).map(t=>`<button data-guide="${t}" class="${t===state.guideTopic?'active':''}">${t}</button>`).join('')}</nav><article class="guide-article">${guideArticles[state.guideTopic]}</article></div>`}
function coverage(){const rows=[['HTTP requests','Available','HTTP/1.1; HTTPS with HTTP/2 negotiation'],['Journey control flow','Available','Nested branches and bounded loops'],['CSV datasets','Partial','Local concurrent-user journeys'],['JMeter import','Partial','Supported JMeter 5.6.3 HTTP components'],['Distributed execution','Partial','Arrival-rate mode'],['Browser JavaScript','Planned','Not implemented'],['Non-HTTP protocols','Planned','Not implemented']];return `${heading('Coverage','Current scope and documented limits')}<div class="table-panel table-scroll"><table><thead><tr><th>Capability</th><th>Status</th><th>Scope</th></tr></thead><tbody>${rows.map(([a,b,c])=>`<tr><td class="name-cell">${a}</td><td><span class="status ${b==='Available'?'good':b==='Partial'?'warn':''}">${b}</span></td><td>${c}</td></tr>`).join('')}</tbody></table></div>`}
function updateUrl(){const p=new URLSearchParams();p.set('variant',state.variant);p.set('view',state.view);if(state.view==='build')p.set('tab',state.tab);if(state.theme==='dark')p.set('theme','dark');try{window.history.replaceState(null,'',`?${p}`)}catch{}}
function render(){document.documentElement.dataset.variant=state.variant;document.documentElement.dataset.theme=state.theme;document.getElementById('app').innerHTML=shell();document.querySelectorAll('.variant-btn').forEach(b=>{b.classList.toggle('chosen',b.dataset.variant===state.variant);b.setAttribute('aria-pressed',String(b.dataset.variant===state.variant))});hideTooltip();updateUrl();bindPanning()}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,3600)}
function setView(view){state.view=view;state.full=false;render();window.scrollTo(0,0)}
function setVariant(variant){state.variant=variant;state.full=false;render()}
function cycleVariant(delta){const list=['A','B','C'];setVariant(list[(list.indexOf(state.variant)+delta+3)%3])}
function dialog(title,body){const d=document.getElementById('dialog');d.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="icon-btn" data-action="close-dialog" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;d.showModal()}
function notes(){dialog('A quieter GoMeter',`<p>Three layouts for the same existing workflows. Start with <strong>A · Workspace</strong>; use the bottom bar to compare.</p><div class="direction"><strong>A · Workspace</strong><span>Recommended. Familiar sidebar, clear forms, and an adjacent traffic plan. Balanced for everyday use.</span></div><div class="direction"><strong>B · Console</strong><span>Horizontal navigation, a section index, compact forms, and aligned result metrics. More information per screen.</span></div><div class="direction"><strong>C · Workbench</strong><span>Icon rail, persistent test explorer, and an editor-focused canvas. Suits repeated work across saved tests.</span></div><h3>Shared design rules</h3><ul><li>System typography: 13 px controls, 15 px sections, 23 px page titles.</li><li>Neutral surfaces, thin borders, 4–6 px corners, one blue action color.</li><li>No decorative gradients, glow, oversized headings, or continuous animation.</li><li>Short labels stay visible. Explanations move to focusable tooltips and the Guide.</li><li>Errors, units, limits, and important warnings remain visible.</li><li>One main action per screen. Advanced settings expand when needed.</li><li>The existing canvas stays: outline, vertical flow, inspector, execution and data links.</li></ul><h3>Try it</h3><p>Edit the traffic plan, validate, select journey nodes, toggle Data flow, pan and zoom, switch themes, preview a run, and compare history entries. Fields and actions are illustrative; this prototype sends no traffic and stores nothing.</p><h3>Performance direction</h3><p>This file has no external assets, frameworks, network calls, or background polling. Product performance needs separate measurement during implementation.</p><h3>Reference principles</h3><p><a href="https://cloudscape.design/foundation/visual-foundation/content-density/" target="_blank" rel="noreferrer">AWS Cloudscape: content density</a> · <a href="https://docs.stripe.com/dashboard/basics" target="_blank" rel="noreferrer">Stripe: task-based dashboard navigation</a></p><p>These are structural references, not pixel copies. No production code has been changed.</p>`)}
function showHelp(){const p=document.getElementById('help-panel');p.hidden=false;p.innerHTML=`<div class="dialog-head"><h2>Help</h2><button class="icon-btn" data-action="close-help" aria-label="Close help">${icon('close')}</button></div><div class="dialog-body"><h3>${state.tab==='journey'?'Journey canvas':'Build a test'}</h3><p>${state.tab==='journey'?'Select a node to edit its request. Use Checks for response assertions and Variables for extracted data.':'Set the base URL, traffic model, duration, and pass criteria. Use Validate before starting a run.'}</p><h3>Arrival rate</h3><p>${helpText.rate}</p><h3>In-flight cap</h3><p>${helpText.cap}</p><h3>Pass criteria</h3><p>Keep errors, latency, and missed arrivals within your limits. A fast response time alone does not prove that the planned load was sent.</p><button class="btn" data-view="guide">Open Guide ${icon('arrow')}</button><p style="margin-top:25px;font-size:11px;color:var(--muted)">Prototype · sample data · no workload traffic</p></div>`;p.querySelector('button').focus()}
function validate(){state.valid=!!state.name.trim()&&/^https?:\/\/[^\s/]+/.test(state.url)&&Number(state.duration)>0&&(state.mode==='rate'?Number(state.rate)>0&&Number(state.cap)>0:Number(state.users)>0);state.validationShown=true;render();return state.valid}
function validationMessage(){return state.valid?`<div class="notice row">${icon('check')}Sample configuration is valid.<span class="spacer"></span><button class="icon-btn" data-action="dismiss-validation" aria-label="Dismiss validation">${icon('close')}</button></div>`:`<div class="notice error" role="alert">Enter a test name, a valid HTTP(S) base URL, and traffic values greater than zero.</div>`}
let runTimer=null;
function start(){if(!validate())return;clearInterval(runTimer);state.running=true;state.elapsed=0;setView('live');toast('Simulated run started. No requests are sent.');runTimer=setInterval(()=>{if(!state.running){clearInterval(runTimer);return}state.elapsed+=3;if(state.elapsed>=30){state.running=false;clearInterval(runTimer);if(state.view==='live')render();toast('Sample run complete. All sample checks passed.');return}if(state.view==='live'){document.getElementById('run-time').textContent=state.elapsed+' / 30s';document.getElementById('run-progress').style.width=state.elapsed/30*100+'%'}},700)}
function rememberNodes(){state.undo.push(JSON.stringify(state.nodes));if(state.undo.length>20)state.undo.shift()}
function addNode(type){rememberNodes();const names={request:'Request',branch:'Branch',loop:'Loop',pause:'Think time'};state.nodes.push({name:names[type],method:type==='branch'?'IF':type==='loop'?'LOOP':type==='pause'?'WAIT':'GET',path:type==='branch'?'{{authenticated}} == true':type==='loop'?'Repeat 3 times':type==='pause'?'200 ms':'/request',body:'',checks:0,extract:type==='branch'?'True / False paths':type==='loop'?'Body path':''});state.selected=state.nodes.length-1;state.valid=false;render();toast(type==='branch'||type==='loop'?'Control-node placement preview. Nested path editing stays in the existing canvas.':'Sample node added.')}
function download(content,name,mime='application/json'){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showTooltip(el){const text=el.dataset.tip;if(!text)return;const t=document.getElementById('tooltip');t.textContent=text;t.hidden=false;const r=el.getBoundingClientRect(),b=t.getBoundingClientRect();let x=Math.min(Math.max(10,r.left+r.width/2-b.width/2),innerWidth-b.width-10),y=r.bottom+8;if(y+b.height>innerHeight-80)y=r.top-b.height-8;t.style.left=x+'px';t.style.top=Math.max(8,y)+'px';el.setAttribute('aria-describedby','tooltip');if(el.classList.contains('help'))el.setAttribute('aria-expanded','true');showTooltip.current=el}
function hideTooltip(){document.getElementById('tooltip').hidden=true;if(showTooltip.current){showTooltip.current.removeAttribute('aria-describedby');if(showTooltip.current.classList.contains('help'))showTooltip.current.setAttribute('aria-expanded','false');showTooltip.current=null}}
function bindPanning(){const graph=document.getElementById('graph');if(!graph)return;let drag;graph.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,start:{...state.pan}};graph.setPointerCapture(e.pointerId)});graph.addEventListener('pointermove',e=>{if(!drag)return;state.pan={x:drag.start.x+e.clientX-drag.x,y:drag.start.y+e.clientY-drag.y};graph.querySelector('.graph-content').style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom/100})`});graph.addEventListener('pointerup',()=>drag=null);graph.addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();state.zoom=Math.max(40,Math.min(150,state.zoom+(e.deltaY>0?-5:5)));graph.querySelector('.graph-content').style.transform=`translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom/100})`;const pct=document.querySelector('.zoom-percent');if(pct)pct.textContent=state.zoom+'%'},{passive:false})}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-run],a[data-action]');if(!el)return;
 if(el.dataset.variant){setVariant(el.dataset.variant);return}if(el.dataset.view){document.getElementById('help-panel').hidden=true;setView(el.dataset.view);return}if(el.dataset.tab){state.tab=el.dataset.tab;state.view='build';render();return}if(el.dataset.mode){state.mode=el.dataset.mode;state.valid=false;render();return}if(el.dataset.node!==undefined){state.selected=Number(el.dataset.node);render();return}if(el.dataset.inspector){state.inspectorTab=el.dataset.inspector;render();return}if(el.dataset.canvasPane){state.mobileInspector=el.dataset.canvasPane==='inspector';render();return}if(el.dataset.detailTab){state.detailTab=el.dataset.detailTab;render();return}if(el.dataset.guide){state.guideTopic=el.dataset.guide;render();return}if(el.dataset.scroll){document.getElementById(el.dataset.scroll).scrollIntoView({behavior:'auto',block:'start'});document.querySelectorAll('[data-scroll]').forEach(b=>b.classList.toggle('active',b===el));return}if(el.dataset.preset){state.name=el.dataset.preset;state.saved=true;state.view='build';render();toast('Sample test loaded.');return}if(el.dataset.run!==undefined){state.view='live';state.running=false;state.name=runs[Number(el.dataset.run)].name;render();toast('Result layout preview uses the same illustrative sample measurements.');return}
 const a=el.dataset.action;if(!a){if(el.classList.contains('help')&&el.dataset.tip){showTooltip(el)}return}
 const actions={theme:()=>{state.theme=state.theme==='light'?'dark':'light';render()},'previous-variant':()=>cycleVariant(-1),'next-variant':()=>cycleVariant(1),'design-notes':notes,'close-dialog':()=>document.getElementById('dialog').close(),'context-help':showHelp,'close-help':()=>document.getElementById('help-panel').hidden=true,validate,save:()=>{if(validate()){state.saved=true;render();toast('Scenario saved for this preview session.')}},start,'edit-test':()=>setView('build'),stop:()=>{state.running=false;clearInterval(runTimer);render();toast('Simulated run stopped. No workload traffic was sent.')},'dismiss-validation':()=>{state.validationShown=false;render()},'zoom-in':()=>{state.zoom=Math.min(150,state.zoom+10);render()},'zoom-out':()=>{state.zoom=Math.max(40,state.zoom-10);render()},fit:()=>{state.pan={x:0,y:0};state.zoom=90;render()},fullscreen:()=>{state.full=!state.full;render()},undo:()=>{if(state.undo.length){state.nodes=JSON.parse(state.undo.pop());state.selected=Math.min(state.selected,state.nodes.length-1);render()}},'move-up':()=>{if(state.selected>0){rememberNodes();[state.nodes[state.selected-1],state.nodes[state.selected]]=[state.nodes[state.selected],state.nodes[state.selected-1]];state.selected--;render()}},'move-down':()=>{if(state.selected<state.nodes.length-1){rememberNodes();[state.nodes[state.selected+1],state.nodes[state.selected]]=[state.nodes[state.selected],state.nodes[state.selected+1]];state.selected++;render()}},'add-request':()=>addNode('request'),'add-branch':()=>addNode('branch'),'add-loop':()=>addNode('loop'),'add-pause':()=>addNode('pause'),'journey-data':()=>{const d=document.getElementById('journey-data');d.open=true;d.scrollIntoView({behavior:'auto',block:'nearest'})},'preview-sequence':()=>dialog('Sequence preview',`<p>No requests are sent.</p><ol>${state.nodes.map(n=>`<li><strong>${esc(n.name)}</strong> <code>${n.method} ${esc(n.path)}</code></li>`).join('')}</ol><p>This previews order, not responses or check outcomes.</p>`),import:()=>dialog('Import a test',`<p>Keep both import workflows in one place.</p><div class="import-options"><button class="btn" data-action="mock-import-json">${icon('code')}JSON<small>Native configuration</small></button><button class="btn" data-action="mock-import-jmx">${icon('upload')}JMeter JMX<small>Review compatibility first</small></button></div>`),'mock-import-json':()=>{document.getElementById('dialog').close();toast('JSON import placement preview. No files are read.')},'mock-import-jmx':()=>dialog('JMeter import',`<p>Compatibility review precedes conversion.</p><div class="definition"><span>Source</span><strong>checkout.jmx · sample</strong></div><div class="definition"><span>Supported components</span><strong>8</strong></div><div class="definition"><span>Review required</span><strong>2</strong></div><div class="notice" style="margin-top:15px">Unsupported behavior blocks runnable conversion.</div><h3>Review</h3><p>Inspect component support, supply properties, and preview the mapped journey before saving. Existing migration drafts remain available.</p>`),'download-json':()=>download(JSON.stringify(configuration(),null,2),'gometer-prototype-scenario.json'),'export-results':()=>dialog('Export results',`<p>Choose a report format. Sample downloads are marked as prototype data.</p><div class="row wrap"><button class="btn" data-action="sample-download">${icon('download')}JSON</button><button class="btn" data-action="sample-download">${icon('download')}HTML</button><button class="btn" data-action="sample-download">${icon('download')}Run bundle</button></div>`),'sample-download':()=>{const sample={prototype:true,sample_data:true,message:'Layout preview only. No workload executed.'};if(el.textContent.trim()==='HTML')download('<!doctype html><html lang="en"><meta charset="utf-8"><title>GoMeter sample report</title><h1>GoMeter sample report</h1><p>Design prototype. No workload executed.</p></html>','gometer-sample-results.html','text/html');else download(JSON.stringify(sample,null,2),el.textContent.trim()==='Run bundle'?'gometer-sample-bundle.json':'gometer-sample-results.json');document.getElementById('dialog').close()},compare:()=>{state.compared=true;render()},'close-compare':()=>{state.compared=false;render()},new:()=>{state.name='Untitled test';state.saved=false;state.view='build';state.tab='settings';render()},shortcuts:()=>dialog('Keyboard shortcuts',`<div class="definition"><span>Previous / next design</span><strong>← / →</strong></div><div class="definition"><span>Close help or tooltip</span><strong>Esc</strong></div><div class="definition"><span>Navigate controls</span><strong>Tab / Shift+Tab</strong></div><p style="margin-top:18px">Arrow keys do not switch designs while editing fields or operating menus.</p>`),checks:()=>dialog('Add a check',`<label class="field"><span>Measurement</span><select><option>Minimum started throughput</option><option>Journey p95</option><option>Journey error rate</option></select></label><p style="margin-top:14px">Existing request and journey acceptance checks remain available.</p><button class="btn primary" data-action="close-dialog">Done</button>`),phases:()=>dialog('Traffic phases',`<p>Sequential phases share one arrival schedule. Zero-rate phases pause arrivals.</p><div class="fields two">${field('Rate','phase-rate',100,'/s','number')}${field('Duration','phase-duration',30,'s','number')}</div><button class="btn" data-action="close-dialog" style="margin-top:15px">Done</button>`),csv:()=>dialog('CSV dataset',`<p>Import and preview send no traffic. CSV currently supports local concurrent-user journeys.</p><div class="fields two"><label class="field"><span>Row sharing</span><select><option>Shared</option><option>Per user</option></select></label><label class="field"><span>End of file</span><select><option>Recycle rows</option><option>Finish user</option></select></label></div><button class="btn" data-action="close-dialog">Done</button>`),migrations:()=>dialog('Migration drafts',`<div class="definition"><span>checkout.jmx</span><strong>2 items to review</strong></div><div class="definition"><span>api-baseline.jmx</span><strong>Ready to review</strong></div><p style="margin-top:15px">Original source and compatibility review stay with each draft.</p>`),'import-run':()=>dialog('Import run',`<p>Import a portable run bundle to inspect its results in History.</p><button class="btn" data-action="close-dialog">${icon('upload')}Choose file · preview</button>`)};if(actions[a])actions[a]()
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.field){state[el.dataset.field]=el.type==='number'?Number(el.value):el.value;state.valid=false;state.saved=false;const t=document.querySelector('#draft-state');if(t){t.className='status';t.textContent='Draft'}if(['rate','users','duration','cap'].includes(el.dataset.field)){const p=document.querySelector('.plan');if(p)p.outerHTML=plan()}return}if(el.id==='history-search'){const caret=el.selectionStart;state.search=el.value;render();const input=document.getElementById('history-search');input.focus();input.setSelectionRange(caret,caret)}if(el.id==='test-search'){document.querySelectorAll('.workbench-list .test-row[data-preset]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(el.value.toLowerCase()))}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='data-flow'){state.dataFlow=el.checked;render()}if(el.dataset.nodeField){rememberNodes();state.nodes[state.selected][el.dataset.nodeField]=el.value;state.valid=false;render()}if(el.id==='status-filter'){state.filter=el.value;render()}if(el.dataset.runSelect!==undefined){const i=Number(el.dataset.runSelect);if(el.checked&&state.selectedRuns.length<2)state.selectedRuns.push(i);else if(!el.checked)state.selectedRuns=state.selectedRuns.filter(n=>n!==i);else toast('Select at most two runs.');state.compared=false;render()}});
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');if(el)showTooltip(el)});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');if(el&&!el.contains(e.relatedTarget))hideTooltip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTooltip(el)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-tip]'))hideTooltip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTooltip();document.getElementById('help-panel').hidden=true;if(state.full){state.full=false;render()}return}if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;if(e.target.closest('input,textarea,select,[contenteditable],dialog,[role=tablist]')||document.getElementById('dialog').open)return;e.preventDefault();cycleVariant(e.key==='ArrowLeft'?-1:1)});
window.addEventListener('scroll',hideTooltip,true);
render();
</script>
