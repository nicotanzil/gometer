function nav(){const names={build:'Build',live:'Live',history:'History',guide:'Guide',coverage:'Coverage'};return `<aside class="side"><a href="?variant=A&form=${state.formStyle}" class="brand" aria-label="GoMeter">${mark}<span class="brand-name">GoMeter</span></a><div class="workspace"><span class="workspace-icon">${icon('folder')}</span>Local workspace<span class="spacer"></span>${icon('down')}</div><nav class="side-nav" aria-label="Workspace">${Object.entries(names).map(([key,label])=>`<button class="nav-item ${state.view===key?'active':''}" data-view="${key}" ${state.view===key?'aria-current="page"':''} aria-label="${label}" data-tip="${label}">${icon(key)}<span class="nav-text">${label}</span></button>`).join('')}</nav><div class="nav-spacer"></div><div class="nav-divider"></div><div class="side-nav secondary-nav"><button class="nav-item" data-action="shortcuts" aria-label="Keyboard shortcuts" data-tip="Keyboard shortcuts">${icon('code')}<span class="nav-text">Shortcuts</span></button></div><div class="side-foot"><div class="row"><span class="status good">Local</span><span class="spacer"></span><span class="mono">0.6.0</span></div><span>HTTP load testing</span></div></aside>`}

function shell(){const title={build:'Build',live:'Live',history:'History',guide:'Guide',coverage:'Coverage'}[state.view];return `<div class="shell">${nav()}${explorer()}<main class="app-main"><header class="topbar"><span class="mobile-brand">${mark}GoMeter</span><span class="crumb-first">Workspace</span><span class="slash">/</span><strong class="current-crumb">${title}</strong><span class="spacer"></span><span class="context-pill" data-tip="${esc(helpText.sample)}">SAMPLE DATA</span><span class="topbar-local status good small">Local</span><span class="separator"></span>${ib(state.theme==='light'?'moon':'sun','theme',`Switch to ${state.theme==='light'?'dark':'light'} theme`)}${ib('help','context-help','Help')}</header><div class="content">${state.view==='build'?builder():state.view==='live'?live():state.view==='history'?history():state.view==='guide'?guide():coverage()}</div></main></div>`}
function heading(title,subtitle,actions=''){return `<div class="page-head"><div class="title-block"><div class="row"><h1>${esc(title)}</h1>${state.view==='build'?`<span class="status ${state.saved?'good':''}" id="draft-state">${state.saved?'Saved':'Draft'}</span>`:''}</div>${subtitle?`<div class="subline">${subtitle}</div>`:''}</div><div class="head-actions">${actions}</div></div>`}
function builder(){return `${heading('Build a test','',`<button class="btn quiet" data-action="import" aria-label="Import test">${icon('upload')}Import</button><button class="btn" data-action="load-example">${icon('folder')}Examples</button>`)}<nav class="main-tabs editor-mode-tabs" aria-label="Test editor"><button data-tab="settings" class="${state.tab==='settings'?'active':''}">Setup</button><button data-tab="journey" class="${state.tab==='journey'?'active':''}">Journey<span class="tab-count">${state.nodes.length}</span></button><button data-tab="json" class="${state.tab==='json'?'active':''}">JSON</button><span class="spacer"></span><span class="tab-meta small muted">${esc(state.name)}</span></nav><div class="validation-slot" id="validation-slot">${state.validationShown?validationMessage():''}</div>${state.tab==='settings'?settings():`<div class="nonform-actions row"><span class="muted small">${state.tab==='journey'?'Existing canvas structure':'Configuration preview'}</span><span class="spacer"></span><button class="btn" data-action="save">Save</button><button class="btn" data-action="validate">Validate</button><button class="btn primary" data-action="start">Start run</button></div>${state.tab==='journey'?journey():jsonView()}`}`}
function settings(){const guided=state.formStyle==='guided';const stage=state.formStep===3?'review':sections[state.formStep][0];return `<div class="form-workspace ${state.formStyle}"><div class="form-editor-area">${guided?`<nav class="step-nav" aria-label="Setup progress">${[['target','Target'],['traffic','Traffic'],['checks','Checks'],['review','Review']].map(([key,label],i)=>`<button data-form-step="${i}" class="${state.formStep===i?'active':''} ${state.formStep>i?'complete':''}" aria-current="${state.formStep===i?'step':'false'}"><span>${state.formStep>i?icon('check'):i+1}</span>${label}</button>`).join('')}</nav>`:''}<div class="form-container">${state.formStyle==='tabbed'?`${formNav()}<div class="section-content">${groupFor(state.formSection)}</div>`:guided?(stage==='review'?reviewStep():groupFor(stage)):`${groupFor('target')}${groupFor('traffic')}${groupFor('checks')}<section class="advanced-group">${advancedFields()}</section>`}</div>${actionBar()}</div><aside class="form-summary">${plan()}<div class="pattern-note"><span>FORM STUDY</span><strong>${{aligned:'Aligned fields',tabbed:'Section editor',guided:'Guided setup'}[state.formStyle]}</strong><p>${{aligned:'One page. Consistent label and input columns.',tabbed:'One section at a time. Direct access to every category.',guided:'Target, traffic, checks, then a review before starting.'}[state.formStyle]}</p></div></aside></div>`}
function plan(){const requests=state.workload==='request',rateLabel=requests?'requests/s':'journeys/s';return `<section class="plan compact-plan" aria-labelledby="plan-heading"><div class="plan-header"><h3 id="plan-heading">Run plan</h3>${tip('Scheduled demand is an estimate. Branches, loops and failed steps can change the number of HTTP attempts.','About the run plan')}</div><div class="plan-body"><div class="plan-rate">${state.mode==='rate'?state.rate:state.users}<small>${state.mode==='rate'?rateLabel:'users'}</small></div><div class="definition"><span>Duration</span><strong>${state.mode==='users'&&state.stopCondition==='iterations'?'Iteration limited':state.duration+'s'}</strong></div><div class="definition"><span>${state.mode==='rate'?'Planned arrivals':'Iterations'}</span><strong>${state.mode==='rate'?(state.rate*state.duration).toLocaleString():state.stopCondition==='duration'?'Duration limited':state.iterations+' / user'}</strong></div><div class="definition"><span>Workload</span><strong>${requests?'Single request':'Checkout journey'}</strong></div><div class="definition"><span>Checks</span><strong>${Object.values(state.enabledChecks).filter(Boolean).length} enabled</strong></div><div class="definition"><span>Execution</span><strong>${state.workers?'Workers':'Local'}</strong></div></div><div class="plan-footer"><span class="status ${state.valid?'good':''}">${state.valid?'Validated':'Not validated'}</span><button class="help" data-action="context-help" aria-label="Run plan help">${icon('help')}</button></div></section>`}
function journey(){const selected=state.nodes[state.selected];return `<section class="canvas-shell ${state.full?'is-fullscreen':''}" aria-label="Journey canvas"><div class="canvas-toolbar"><span class="canvas-mobile-tabs"><button class="${!state.mobileInspector?'active':''}" data-canvas-pane="canvas">Canvas</button><button class="${state.mobileInspector?'active':''}" data-canvas-pane="inspector">Inspector</button></span><label class="check"><input type="checkbox" id="data-flow" ${state.dataFlow?'checked':''}><span class="data-flow-label">Data flow</span></label>${tip('data','About data flow')}<span class="spacer"></span><span class="toolbar-label muted small">Checkout</span><span class="separator"></span>${ib('undo','undo','Undo',state.undo.length?'':'disabled')}${ib('minus','zoom-out','Zoom out')}<span class="zoom-percent mono small muted">${state.zoom}%</span>${ib('plus','zoom-in','Zoom in')}<button class="btn quiet small" data-action="fit">Fit</button>${ib('expand','fullscreen',state.full?'Exit full screen':'Full screen')}</div><div class="canvas-layout ${state.mobileInspector?'show-inspector':''}"><aside class="outline"><h3>Journey</h3><div class="journey-name">Checkout<span class="small">100%</span></div><h3>Flow outline</h3>${state.nodes.map((n,i)=>`<button class="outline-step ${i===state.selected?'active':''}" data-node="${i}"><span class="index">${String(i+1).padStart(2,'0')}</span>${esc(n.name)}</button>`).join('')}<div class="outline-add">${[['plus','request','Request'],['branch','branch','Branch'],['loop','loop','Loop'],['pause','pause','Think time']].map(([ic,action,label])=>`<button data-action="add-${action}">${icon(ic)}${label}</button>`).join('')}</div><button class="btn quiet small" data-action="journey-data" style="margin-top:18px">${icon('more')}Data & settings</button></aside><div class="graph" id="graph" aria-label="Flow canvas; drag background to pan"><div class="graph-content" style="transform:translate(${state.pan.x}px,${state.pan.y}px) scale(${state.zoom/100})"><div class="flow-cap"><i class="dot"></i>Journey start</div><div class="flow-link"></div>${state.nodes.map((n,i)=>`<button class="flow-node ${i===state.selected?'selected':''}" data-node="${i}" aria-label="Edit ${esc(n.name)}"><div class="node-heading"><span>${esc(n.name)}</span><span class="node-index">${String(i+1).padStart(2,'0')}</span></div><div class="node-path"><span class="method">${n.method}</span>${esc(n.path)}</div><div class="node-meta"><span>${n.checks} checks</span><span class="extracted">${esc(n.extract)}</span></div></button><div class="flow-link"></div>`).join('')}<div class="flow-cap"><i class="dot"></i>Journey end</div>${state.dataFlow?'<svg class="data-edges" viewBox="0 0 370 510" aria-hidden="true"><path d="M68 108C7 108 7 230 68 230M68 108C-11 108 -11 352 68 352"/></svg>':''}</div></div><aside class="canvas-inspector" aria-label="Request inspector"><div class="inspector-heading"><span>${esc(selected.name)}</span><span class="tag">${String(state.selected+1).padStart(2,'0')}</span></div><nav class="mini-tabs" aria-label="Inspector">${['request','checks','variables'].map(t=>`<button data-inspector="${t}" class="${state.inspectorTab===t?'active':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</nav><div class="inspector-body">${inspector(selected)}</div><div class="inspector-actions">${ib('up','move-up','Move step up',state.selected===0?'disabled':'')}${ib('down','move-down','Move step down',state.selected===state.nodes.length-1?'disabled':'')}<span class="spacer"></span><button class="btn quiet small" data-action="preview-sequence">Preview ${icon('play')}</button></div></aside></div><footer class="canvas-footer"><span class="row"><i class="line-key"></i>Execution<span class="row data-key-label"><i class="line-key dotted"></i>Data</span></span><span class="canvas-hint">Drag to pan</span><span class="small">${state.nodes.length} nodes · 1 journey</span></footer></section><details class="canvas-settings" id="journey-data"><summary>Journey settings & data</summary><div class="fields">${field('Journey name','journey-name','Checkout')}${field('Weight','weight',100,'%','number','weight')}${field('Timeout','journey-timeout',5,'s','number')}<label class="field full"><span>Variables</span><textarea class="mono" aria-label="Journey variables">username = demo\nitem = starter</textarea></label></div><div class="row" style="margin-top:14px"><button class="btn small" data-action="csv">${icon('upload')}Import CSV</button><span class="muted small">Local concurrent-user journeys</span></div></details>`}
function inspector(n){if(state.inspectorTab==='checks')return `<div class="section-head"><h3>Response checks</h3>${tip('errors','About response checks')}</div><label class="field"><span>Status codes</span><input value="200" aria-label="Expected status codes"></label><label class="field"><span>JSON Pointer</span><input value="/authenticated" class="mono" aria-label="JSON Pointer check"></label><label class="field"><span>Expected value</span><input value="true" class="mono" aria-label="Expected JSON value"></label><button class="btn small" data-action="checks">${icon('plus')}Add check</button>`;if(state.inspectorTab==='variables')return `<div class="section-head"><h3>Extract values</h3>${tip('token','About extracted variables')}</div><div class="fields one"><label class="field"><span>Variable</span><input value="token" class="mono" aria-label="Extraction variable"></label><label class="field"><span>JSON Pointer</span><input value="/token" class="mono" aria-label="Extraction JSON Pointer"></label></div><div class="details"><summary style="cursor:default">Available before step</summary><div class="row wrap" style="margin-top:12px"><span class="tag">username</span><span class="tag">item</span>${state.selected>0?'<span class="tag">token</span>':''}</div></div>`;return `<label class="field"><span>Step name</span><input data-node-field="name" value="${esc(n.name)}"></label><div class="fields two"><label class="field"><span>Method</span><select data-node-field="method">${['GET','POST','PUT','PATCH','DELETE','IF','LOOP'].map(m=>`<option ${n.method===m?'selected':''}>${m}</option>`).join('')}</select></label><label class="field"><span>Pause</span><span class="input-unit"><input value="0" type="number" aria-label="Pause after success"><span class="unit">ms</span></span></label></div><label class="field"><span>Request path</span><input data-node-field="path" value="${esc(n.path)}" class="mono"></label><details class="details" open><summary>Headers<span class="count">1</span></summary><label class="field"><span class="hidden">Content-Type header</span><input value="application/json" aria-label="Content-Type header value" class="mono"></label></details><label class="field" style="margin-top:18px"><span>Body</span><textarea data-node-field="body" spellcheck="false">${esc(n.body)}</textarea></label>`}
function configuration(){return {name:state.name,url:state.url,mode:state.mode,...(state.mode==='rate'?{rate:Number(state.rate),max_in_flight:Number(state.cap)}:{vus:Number(state.users)}),duration:`${state.duration}s`,thresholds:{p95:`${state.latency}ms`,max_error_percent:Number(state.error),max_drop_percent:Number(state.missed)},scenarios:[{name:'Checkout',weight:100,data:[{username:'demo',item:'starter'}],steps:state.nodes.map(n=>({name:n.name,method:n.method,path:n.path,...(n.body?{body:n.body}:{})}))}]}}
function jsonView(){return `<div class="json-layout"><textarea class="json-editor" aria-label="Scenario JSON" spellcheck="false" id="scenario-json">${esc(JSON.stringify(configuration(),null,2))}</textarea><aside class="json-note"><h3>Scenario JSON</h3><p>The dashboard and CLI use the same configuration.</p><button class="btn small" data-action="download-json">${icon('download')}Export JSON</button><p class="quiet-note">This prototype previews JSON. Use Settings or Journey to edit the sample.</p></aside></div>`}
function metric(label,value,unit,foot,kind='',help=''){return `<div class="metric"><div class="metric-label">${label}${help?tip(help,`About ${label}`):''}</div><div class="metric-value">${value}<small>${unit}</small></div><div class="metric-foot ${kind}">${foot}</div></div>`}
function chart(title,type){const isTraffic=type==='traffic';const points=isTraffic?'48,87 65,83 80,85 95,82 110,84 125,81 140,84 155,82 170,87 185,82 200,84 215,81 230,85 245,82 260,81 275,83 290,86 305,82 320,85 335,81 350,84 365,82 380,85 395,82 410,83 425,81 440,84':'48,114 65,106 80,109 95,101 110,112 125,97 140,102 155,110 170,100 185,108 200,94 215,104 230,98 245,109 260,100 275,90 290,105 305,97 320,108 335,93 350,101 365,98 380,106 395,97 410,110 425,100 440,103';return `<section class="chart-panel"><div class="chart-heading"><span>${title}</span><span class="small">${isTraffic?'journeys/s':'ms'}</span></div><svg class="chart" viewBox="0 0 480 210" role="img" aria-label="${title}, illustrative sample data"><path class="grid" d="M48 40H448M48 80H448M48 120H448M48 160H448"/><text x="12" y="44">${isTraffic?'150':'300'}</text><text x="12" y="84">${isTraffic?'100':'200'}</text><text x="19" y="124">${isTraffic?'50':'100'}</text><text x="26" y="164">0</text><text x="43" y="190">0s</text><text x="166" y="190">10s</text><text x="297" y="190">20s</text><text x="429" y="190">30s</text>${isTraffic?'<path class="reference" d="M48 80H440"/>':'<path class="threshold-line" d="M48 80H440"/>'}<polyline class="trace" points="${points}"/></svg><div class="chart-legend"><span><i></i>${isTraffic?'Started':'HTTP p95'}</span><span><i class="gray"></i>${isTraffic?'Scheduled':'200 ms limit'}</span></div></section>`}
function live(){return `${heading(state.name,'Run #1042 · Local · Sample results',`<button class="btn" data-action="export-results">${icon('download')}Export</button>${state.running?`<button class="btn danger" data-action="stop">${icon('stop')}Stop</button>`:`<button class="btn" data-action="edit-test">${icon('build')}Edit test</button><button class="btn primary" data-action="start">${icon('play')}Run again</button>`}`)}<div class="run-strip"><span class="status ${state.running?'blue':'good'}">${state.running?'Running':'Passed'}</span><span class="mono" id="run-time">${state.running?state.elapsed+' / 30s':'30 / 30s'}</span><div class="progress"><span id="run-progress" style="width:${state.running?state.elapsed/30*100:100}%"></span></div><span class="spacer"></span><span class="run-strip-extra">Checkout · ${state.nodes.length} steps</span><span class="mono small">${esc(state.url)}</span></div><div class="metric-grid">${metric('Journey arrivals','100','/s','Scheduled demand','','journeys')}${metric('HTTP throughput','300','/s','3 steps per journey','','journeys')}${metric('HTTP latency · p95','142','ms','Limit ≤ 200 ms','good','latency')}${metric('HTTP errors','0.0','%','0 failed attempts','good','errors')}${metric('Missed arrivals','0.0','%','All arrivals started','good','missed')}${metric('Completed journeys','3,000','','9,000 HTTP attempts','','journeys')}</div><div class="chart-grid">${chart('Journey arrivals','traffic')}${chart('Response latency','latency')}</div><section class="tabs-section"><nav class="main-tabs" aria-label="Result details">${['Checks','Requests','Generator','Workers','Telemetry'].map(t=>`<button data-detail-tab="${t}" class="${state.detailTab===t?'active':''}">${t}</button>`).join('')}</nav>${resultDetail()}</section>`}
function resultDetail(){const groups={Checks:[['HTTP p95','142 ms / 200 ms'],['HTTP errors','0% / 1%'],['Missed arrivals','0% / 0%'],['Verdict','All checks passed']],Requests:[['Login','POST /login'],['Profile','GET /profile'],['Checkout','POST /checkout'],['HTTP attempts','9,000 completed']],Generator:[['Process CPU','8.2%'],['Go memory','24.8 MiB'],['Arrival delay · p95','0.8 ms'],['Connection reuse','99.4%']],Workers:[['Execution','Local'],['Workers','None configured'],['Result coverage','Complete'],['Mode','Arrival rate']],Telemetry:[['Collection','Off'],['Exporter','Not configured'],['CPU','Not collected'],['Memory','Not collected']]};return `<div class="detail-grid">${groups[state.detailTab].map(([k,v])=>`<div><div class="detail-name">${k}</div><strong>${v}</strong></div>`).join('')}</div>`}
function history(){const shown=runs.map((r,i)=>({...r,i})).filter(r=>r.name.toLowerCase().includes(state.search.toLowerCase())&&(state.filter==='all'||r.status.toLowerCase()===state.filter));return `${heading('Run history','6 runs · Local workspace',`<button class="btn" data-action="import-run">${icon('upload')}Import run</button>`)}<div class="table-toolbar"><div class="search-wrap">${icon('search')}<input class="search-input" id="history-search" placeholder="Find a run…" aria-label="Find a run" value="${esc(state.search)}"></div><select id="status-filter" class="standalone-select" aria-label="Filter by status">${[['all','All statuses'],['passed','Passed'],['failed','Failed'],['stopped','Stopped']].map(([v,l])=>`<option value="${v}" ${state.filter===v?'selected':''}>${l}</option>`).join('')}</select><span class="spacer"></span><button class="btn" data-action="compare" ${state.selectedRuns.length!==2?'disabled':''}>${icon('compare')}Compare${state.selectedRuns.length?' ('+state.selectedRuns.length+'/2)':''}</button></div><div class="table-panel"><div class="table-scroll"><table><thead><tr><th style="width:35px"><span class="muted" data-tip="Select two runs to compare">${icon('compare')}</span></th><th>Test</th><th>Status</th><th>Started</th><th class="num">Rate /s</th><th class="num">p95 · ms</th><th class="num">Errors %</th><th class="num">Missed %</th><th>Duration</th><th></th></tr></thead><tbody>${shown.map(r=>`<tr><td><input type="checkbox" data-run-select="${r.i}" aria-label="Select ${r.name}, ${r.time}" ${state.selectedRuns.includes(r.i)?'checked':''}></td><td class="name-cell" data-run="${r.i}"><button data-run="${r.i}" style="padding:0;font-weight:550;text-align:left">${r.name}</button></td><td><span class="status ${r.status==='Passed'?'good':r.status==='Failed'?'bad':''}">${r.status}</span></td><td>${r.time}</td><td class="num mono">${r.rate}</td><td class="num mono">${r.p95}</td><td class="num mono">${r.error}</td><td class="num mono">${r.missed}</td><td class="mono">${r.duration}</td><td>${ib('download','export-results','Export run')}</td></tr>`).join('')}</tbody></table>${shown.length?'':'<div class="empty">No matching runs.</div>'}</div><footer class="table-footer"><span>${shown.length} of ${runs.length} runs</span><span>Select two runs to compare</span></footer></div>${state.compared&&state.selectedRuns.length===2?compare():''}`}
function compare(){const a=runs[state.selectedRuns[0]],b=runs[state.selectedRuns[1]];return `<section class="compare-panel"><div class="row spread"><h2>Run comparison</h2><button class="icon-btn" data-action="close-compare" aria-label="Close comparison">${icon('close')}</button></div><div class="compare-values"><div><p>HTTP p95</p><strong>${a.p95} → ${b.p95}<small class="muted"> ms</small></strong></div><div><p>HTTP errors</p><strong>${a.error} → ${b.error}<small class="muted"> %</small></strong></div><div><p>Missed arrivals</p><strong>${a.missed} → ${b.missed}<small class="muted"> %</small></strong></div></div></section>`}
const guideArticles={
'First test':`<h2>Your first test</h2><p>Start with a small workload against the bundled demo.</p><h3>1. Start the demo</h3><pre class="code-block">./bin/gometer-demo</pre><h3>2. Configure traffic</h3><p>Use the local demo target, choose an arrival rate or concurrent users, then set the duration and acceptance checks.</p><h3>3. Validate and run</h3><p>Validation sends no workload traffic. Start the run explicitly, then review errors, latency, missed arrivals, and the final verdict together.</p><button class="btn primary" data-action="edit-test">Open builder ${icon('arrow')}</button>`,
'Traffic models':`<h2>Traffic models</h2><h3>Arrival rate</h3><p>Schedule new request or journey arrivals independently of response time. If the generator cannot start work, GoMeter records the missed demand.</p><h3>Concurrent users</h3><p>Each user repeats requests or journeys independently. Configure duration, iterations, ramp-up, and startup delay.</p><h3>Units matter</h3><p>One journey can produce several HTTP attempts. Compare journey arrivals with journey arrivals, and request throughput with request throughput.</p>`,
'Journey canvas':`<h2>Journey canvas</h2><p>The canvas keeps the current outline, vertical execution flow, and request inspector.</p><ul><li>Select a node to edit its request, checks, and extracted variables.</li><li>Solid arrows show execution. Dotted links show data dependencies.</li><li>Branches select a path. Loops repeat their child steps.</li><li>Use the outline or inspector controls to reorder steps.</li><li>Pan, zoom, fit, and full screen support larger journeys.</li></ul><button class="btn" data-tab="journey">Open canvas ${icon('arrow')}</button>`,
'Results':`<h2>Read a run</h2><p>A passed run completed with all configured checks satisfied. Review the measurements together.</p><h3>Latency</h3><p>Latency includes the response body and completed failed attempts. Percentiles are histogram estimates.</p><h3>Missed arrivals</h3><p>Missed arrivals never started and have no response-latency sample. Fast responses alone do not prove that the planned load was delivered.</p><h3>Unknown data</h3><p>Missing telemetry and incomplete worker results remain unknown. They are not displayed as zero.</p>`,
'Workers & data':`<h2>Workers & data</h2><h3>Distributed execution</h3><p>Add authenticated workers under Execution. Distributed runs currently support arrival-rate mode.</p><h3>CSV data</h3><p>Import CSV under Journey settings & data. Map columns to variables and choose shared or per-user rows. CSV allocation currently supports local concurrent-user journeys.</p><h3>Remote access</h3><p>The dashboard is single-user and local by default. Remote access requires a private authenticated ingress.</p>`};
function guide(){return `${heading('Guide','Reference when you need it')}<div class="guide-grid"><nav class="guide-nav" aria-label="Guide topics">${Object.keys(guideArticles).map(t=>`<button data-guide="${t}" class="${t===state.guideTopic?'active':''}">${t}</button>`).join('')}</nav><article class="guide-article">${guideArticles[state.guideTopic]}</article></div>`}

function formGroup(key,title,body,optional=false){return `<section class="form-group" id="group-${key}" aria-labelledby="heading-${key}"><div class="group-head"><span class="section-number">${String(sections.findIndex(s=>s[0]===key)+1).padStart(2,'0')}</span><h2 id="heading-${key}">${title}</h2>${optional?'<span class="optional">Optional</span>':''}</div><div class="group-body">${body}</div></section>`}
function disclosure(id,title,summary,body){return `<details class="form-disclosure" id="details-${id}" ${state.detailsOpen[id]?'open':''}><summary><span>${title}</span><span class="disclosure-summary">${summary}</span>${icon('down')}</summary><div class="disclosure-body">${body}</div></details>`}
function targetFields(){return `${control('Test name','name',state.name)}<div class="form-row"><div class="fr-label" id="workload-label">Workload</div><div class="fr-control"><div class="segmented" role="group" aria-labelledby="workload-label"><button data-workload="request" class="${state.workload==='request'?'active':''}" aria-pressed="${state.workload==='request'}">Single request</button><button data-workload="journey" class="${state.workload==='journey'?'active':''}" aria-pressed="${state.workload==='journey'}">Journey</button></div></div></div>${state.workload==='request'?`<div class="form-row endpoint-row"><div class="fr-label"><label for="form-url">Request URL</label>${tip('Full HTTP or HTTPS endpoint. Validation sends no requests.','About request URL')}</div><div class="fr-control"><div class="request-control"><select aria-label="HTTP method" data-field="method">${['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'].map(m=>`<option ${m===state.method?'selected':''}>${m}</option>`).join('')}</select><input type="url" id="form-url" data-field="url" class="mono" value="${esc(state.url)}" aria-invalid="${!!state.errors.url}" ${state.errors.url?'aria-describedby="form-url-error"':''}></div>${state.errors.url?`<p class="field-error" id="form-url-error">${esc(state.errors.url)}</p>`:''}</div></div>`:control('Base URL','url',state.url,{type:'url',mono:true,help:'base'})+`<div class="form-row"><div class="fr-label">Journey</div><div class="fr-control"><div class="journey-reference"><span class="row">${icon('branch')}Checkout<span class="muted small">${state.nodes.length} steps</span></span><button class="btn quiet small" data-tab="journey">Edit ${icon('arrow')}</button></div></div></div>`}${disclosure('request','Request options',state.headerName?'1 header · 5s timeout':'Defaults',`${control('Header name','headerName',state.headerName,{mono:true,optional:true})}${control('Header value','headerValue',state.headerValue,{mono:true,optional:true})}${control('Body','body',state.body,{type:'textarea',mono:true,optional:true,placeholder:'{"key": "value"}'})}${control('Success codes','successStatuses',state.successStatuses,{mono:true,help:'Expected response status codes. By default, all 2xx responses are successful.'})}${control('Timeout','timeout',state.timeout,{type:'number',unit:'s',narrow:true})}<div class="form-row"><div class="fr-label">HTTPS</div><div class="fr-control"><label class="check"><input type="checkbox" data-setting="tlsVerify" ${state.tlsVerify?'checked':''}>Verify certificates</label>${!state.tlsVerify?'<div class="warning-inline" role="status">Certificate verification is off. Use only for trusted development targets.</div>':''}</div></div>`)}`}
function trafficFields(){return `<div class="form-row"><div class="fr-label" id="model-label">Load model${tip('rate','About load models')}</div><div class="fr-control"><div class="segmented" role="group" aria-labelledby="model-label"><button data-mode="rate" class="${state.mode==='rate'?'active':''}" aria-pressed="${state.mode==='rate'}">Arrival rate</button><button data-mode="users" class="${state.mode==='users'?'active':''}" aria-pressed="${state.mode==='users'}">Concurrent users</button></div></div></div>${state.mode==='rate'?control('Arrival rate','rate',state.rate,{type:'number',unit:state.workload==='journey'?'journeys/s':'requests/s',narrow:true,help:'rate'}):control('Users','users',state.users,{type:'number',narrow:true})}${state.mode==='users'?control('Stop after','stopCondition',state.stopCondition,{select:[['duration','Duration'],['iterations','Iterations / user'],['whichever comes first','First limit reached']]}):''}${state.mode==='rate'||state.stopCondition!=='iterations'?control('Duration','duration',state.duration,{type:'number',unit:'s',narrow:true,help:'duration'}):''}${state.mode==='users'&&state.stopCondition!=='duration'?control('Iterations','iterations',state.iterations,{type:'number',unit:'/user',narrow:true}):''}${state.mode==='rate'?control('In-flight cap','cap',state.cap,{type:'number',narrow:true,help:'cap'}):''}${disclosure('timing','Timing & failure',state.mode==='rate'?'Fixed · no delay':'No ramp · no delay',`${control('Start delay','startup',state.startup,{type:'number',unit:'s',narrow:true,optional:true})}${state.mode==='users'?control('Ramp-up','ramp',state.ramp,{type:'number',unit:'s',narrow:true,optional:true}):control('Arrival spacing','distribution',state.distribution,{select:['Fixed intervals','Seeded jitter']})}${control('Think time','think',state.think,{type:'number',unit:'s',narrow:true,optional:true})}${control('On failure','onError',state.onError,{select:['Next iteration','Continue journey','Stop user','Stop test','Stop immediately']})}<div class="form-row"><div class="fr-label">Traffic phases</div><div class="fr-control"><button class="btn small" data-action="phases">${icon('plus')}Add phase</button></div></div>`)}`}
function checkFields(){return `<div class="check-table"><div class="check-table-head"><span>Measurement</span><span>Limit</span></div>${[['latency','HTTP p95','≤','ms','p95'],['error','HTTP errors','≤','%','errors'],['missed','Missed arrivals','≤','%','missed'],['minRps','Started throughput','≥','/s','Minimum HTTP attempts started per second. This is not a journey-arrival target.']].map(([key,label,op,unit,help])=>`<div class="check-table-row"><div class="check-name"><label class="check"><input type="checkbox" data-check-toggle="${key}" ${state.enabledChecks[key]?'checked':''}><span>${label}</span></label>${tip(help,`About ${label}`)}</div><div class="check-limit"><span class="comparator">${op}</span><div class="fr-input has-unit narrow"><input type="number" id="form-${key}" aria-label="${label} limit" data-field="${key}" value="${state[key]}" min="0" step="any" ${!state.enabledChecks[key]?'disabled':''}><span class="fr-unit">${unit}</span></div></div></div>`).join('')}</div><div class="check-footer">Unchecked limits are off.</div>`}
function advancedFields(){return `${disclosure('execution','Execution',state.workers?'Workers configured':'Local',`${control('Workers','workers',state.workers,{type:'textarea',mono:true,optional:true,placeholder:'https://worker-1.internal:8090',note:'One worker origin per line. Arrival-rate mode only.'})}<div id="workers-warning" class="warning-inline" ${state.workers.includes('http://')?'':'hidden'}>Remote HTTP workers require startup opt-in. Tokens and test configuration travel without application TLS.</div>${control('Diagnostics','diagnostics',state.diagnostics,{select:['Standard','Detailed','Off']})}`)}${disclosure('telemetry','Server telemetry',state.telemetryUrl?'Exporter configured':'Off',`${control('Exporter URL','telemetryUrl',state.telemetryUrl,{type:'url',mono:true,optional:true,placeholder:'http://127.0.0.1:8787/metrics'})}${control('Interval','telemetryInterval',state.telemetryInterval,{type:'number',unit:'s',narrow:true})}${control('Timeout','telemetryTimeout',state.telemetryTimeout,{type:'number',unit:'s',narrow:true})}${control('Authentication','telemetryAuth',state.telemetryAuth,{select:['None','Bearer token']})}${control('Metrics','telemetryMetrics',state.telemetryMetrics,{type:'textarea',mono:true,optional:true,placeholder:'app_active_requests\napp_requests_total'})}`)}<div class="form-row json-link-row"><div class="fr-label">Configuration</div><div class="fr-control"><button class="btn small" data-tab="json">${icon('code')}Advanced JSON</button></div></div>`}
function groupFor(key){return key==='target'?formGroup(key,'Target',targetFields()):key==='traffic'?formGroup(key,'Traffic',trafficFields()):key==='checks'?formGroup(key,'Pass criteria',checkFields()):formGroup(key,'Advanced',advancedFields(),true)}
function formNav(){return `<nav class="form-nav" aria-label="Form sections">${sections.map(([id,title])=>`<button data-form-section="${id}" class="${state.formSection===id?'active':''}" ${state.formSection===id?'aria-current="step"':''}>${icon(id==='target'?'link':id==='traffic'?'live':id==='checks'?'check':'server')}<span>${title}</span>${state.formSection===id?icon('chevron'):''}</button>`).join('')}</nav>`}
function reviewStep(){return `<section class="form-group review-step"><div class="group-head"><span class="section-number">04</span><h2>Review</h2></div><div class="review-body">${[['Target',`${state.method} ${state.url}`,'target'],['Traffic',state.mode==='rate'?`${state.rate} ${state.workload==='journey'?'journeys':'requests'}/s · ${state.duration}s`:`${state.users} users · ${state.duration}s`,'traffic'],['Pass criteria',`${Object.values(state.enabledChecks).filter(Boolean).length} checks enabled`,'checks']].map(([label,value,section])=>`<div class="review-answer"><div><h3>${label}</h3><p>${esc(value)}</p></div><button class="btn quiet small" data-form-section="${section}" aria-label="Change ${label}">Edit</button></div>`).join('')}<details class="form-disclosure" id="details-review-advanced" ${state.detailsOpen['review-advanced']?'open':''}><summary>Advanced options${icon('down')}</summary><div class="disclosure-body">${advancedFields()}</div></details></div></section>`}
function actionBar(){const guided=state.formStyle==='guided';return `<footer class="form-actions"><div class="row action-caption"><span class="status ${state.valid?'good':''}">${state.valid?'Validated':'Draft'}</span>${tip('No requests are sent until Start run. This mockup only simulates a run.','About starting a run')}</div><span class="spacer"></span>${guided&&state.formStep>0?'<button class="btn" data-form-back>Back</button>':''}<button class="btn" data-action="save" aria-label="Save scenario">Save</button><button class="btn" data-action="validate">Validate</button>${guided&&state.formStep<3?'<button class="btn primary" data-form-next>Continue '+icon('arrow')+'</button>':'<button class="btn primary" data-action="start">'+icon('play')+'Start run</button>'}</footer>`}
function setFormStyle(value){state.formStyle=value;state.variant='A';state.full=false;render()}
const baseNav=nav;
nav=function(){return baseNav().replace('<aside class="side">','<aside class="side" id="form-sidebar">').replace('<div class="workspace">',`<button class="collapse-control icon-btn" data-collapse-sidebar aria-label="${state.sidebarCollapsed?'Expand sidebar':'Collapse sidebar'}" aria-expanded="${!state.sidebarCollapsed}" aria-controls="form-sidebar">${icon(state.sidebarCollapsed?'chevron':'sidebar')}</button><div class="workspace">`)};
const baseRender=render;
render=function(){if(!state.valid&&!Object.keys(state.errors).length)state.validationShown=false;baseRender();document.documentElement.dataset.formStyle=state.formStyle;document.documentElement.dataset.sidebar=state.sidebarCollapsed?'collapsed':'expanded';document.querySelectorAll('[data-form-style]').forEach(b=>{b.classList.toggle('chosen',b.dataset.formStyle===state.formStyle);b.setAttribute('aria-pressed',String(b.dataset.formStyle===state.formStyle))});document.querySelectorAll('.side .nav-item').forEach(b=>b.dataset.tip=b.getAttribute('aria-label')||b.textContent.trim());fitFormPanel()};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.formStyle){setFormStyle(b.dataset.formStyle);return}
 if(b.hasAttribute('data-collapse-sidebar')){state.sidebarCollapsed=!state.sidebarCollapsed;render();document.querySelector('[data-collapse-sidebar]').focus();return}
 if(b.dataset.workload){if(state.workload==='request')state.requestUrl=state.url;else state.journeyUrl=state.url;state.workload=b.dataset.workload;state.url=state.workload==='request'?state.requestUrl:state.journeyUrl;state.valid=false;state.validationShown=false;render();return}
 if(b.dataset.formSection){state.formSection=b.dataset.formSection;state.formStep=sections.findIndex(s=>s[0]===b.dataset.formSection);render();return}
 if(b.dataset.formStep!==undefined){state.formStep=Number(b.dataset.formStep);render();return}
 if(b.hasAttribute('data-form-next')){state.formStep=Math.min(3,state.formStep+1);render();document.querySelector('.form-group h2')?.focus();return}
 if(b.hasAttribute('data-form-back')){state.formStep=Math.max(0,state.formStep-1);render();return}
 if(b.dataset.action==='load-example'){dialog('Examples',`<p>Load a sample configuration for the form preview.</p><div class="row wrap"><button class="btn" data-form-example="request">API smoke</button><button class="btn" data-form-example="journey">Checkout journey</button></div>`)}
 if(b.dataset.formExample){state.workload=b.dataset.formExample;state.name=state.workload==='request'?'API smoke':'Checkout smoke';state.url=state.workload==='request'?state.requestUrl:state.journeyUrl;document.getElementById('dialog').close();render()}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.checkToggle){state.enabledChecks[el.dataset.checkToggle]=el.checked;state.valid=false;render()}
 if(el.dataset.setting){state[el.dataset.setting]=el.checked;state.valid=false;render()}
 if(['stopCondition','onError','distribution','diagnostics','telemetryAuth','method'].includes(el.dataset.field)){state[el.dataset.field]=el.value;render()}
});
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(!key)return;state.validationShown=false;delete state.errors[key];e.target.setAttribute('aria-invalid','false');const error=document.getElementById('form-'+key+'-error');if(error)error.remove();const v=document.getElementById('validation-slot');if(v)v.innerHTML='';const footer=document.querySelector('.form-actions .status');if(footer){footer.className='status';footer.textContent='Draft'}if(key==='workers'){const warning=document.getElementById('workers-warning');if(warning)warning.hidden=!state.workers.includes('http://')}const planEl=document.querySelector('.plan');if(planEl&&!['rate','users','duration','cap'].includes(key))planEl.outerHTML=plan()});
document.addEventListener('toggle',e=>{if(e.target.matches('details.form-disclosure'))state.detailsOpen[e.target.id.replace('details-','')]=e.target.open},true);

function fitFormPanel(){const panel=document.querySelector('.form-container'),actions=document.querySelector('.form-actions');if(!panel||!actions)return;if(innerWidth<=720){panel.style.maxHeight='';panel.style.minHeight='';return}const bottom=document.querySelector('.review-bar').getBoundingClientRect().top-15;const height=Math.max(200,bottom-panel.getBoundingClientRect().top-actions.getBoundingClientRect().height-parseFloat(getComputedStyle(actions).marginTop));panel.style.maxHeight=height+'px';if(state.formStyle!=='aligned')panel.style.minHeight=Math.min(state.formStyle==='tabbed'?540:400,height)+'px'}
window.addEventListener('resize',fitFormPanel);


render();
</script>
</body>
</html>
