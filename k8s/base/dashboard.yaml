apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gometer-dashboard-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gometer-dashboard
  labels:
    app.kubernetes.io/name: gometer-dashboard
    app.kubernetes.io/part-of: gometer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gometer-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gometer-dashboard
        app.kubernetes.io/part-of: gometer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/nicotanzil/gometer:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - ui
            - -listen
            - 0.0.0.0:8790
            - -public-origin
            - https://gometer.example.internal
            - -data
            - /data
          ports:
            - name: http
              containerPort: 8790
              protocol: TCP
          env:
            - name: GOMETER_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gometer-worker-token
                  key: token
            - name: GOMETER_WORKER_CA
              value: /etc/gometer/worker-ca/ca.crt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: worker-ca
              mountPath: /etc/gometer/worker-ca
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gometer-dashboard-data
        - name: worker-ca
          secret:
            secretName: gometer-worker-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: gometer-dashboard
  labels:
    app.kubernetes.io/name: gometer-dashboard
    app.kubernetes.io/part-of: gometer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gometer-dashboard
  ports:
    - name: http
      port: 8790
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gometer-dashboard-ingress-controller-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gometer-dashboard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gometer-ingress-controller: "true"
          podSelector:
            matchLabels:
              gometer-ingress-controller: "true"
      ports:
        - protocol: TCP
          port: 8790
