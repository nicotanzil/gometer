apiVersion: v1
kind: Service
metadata:
  name: gometer-workers
  labels:
    app.kubernetes.io/name: gometer-worker
    app.kubernetes.io/part-of: gometer
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: gometer-worker
  ports:
    - name: control
      port: 8801
      targetPort: control
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gometer-worker
  labels:
    app.kubernetes.io/name: gometer-worker
    app.kubernetes.io/part-of: gometer
spec:
  serviceName: gometer-workers
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: gometer-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gometer-worker
        app.kubernetes.io/part-of: gometer
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/replace-me/gometer:0.6.0
          imagePullPolicy: IfNotPresent
          args:
            - worker
            - -listen
            - 0.0.0.0:8801
            - -name
            - $(POD_NAME)
            - -tls-cert
            - /etc/gometer/worker-tls/tls.crt
            - -tls-key
            - /etc/gometer/worker-tls/tls.key
          ports:
            - name: control
              containerPort: 8801
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOMETER_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gometer-worker-token
                  key: token
          volumeMounts:
            - name: worker-tls
              mountPath: /etc/gometer/worker-tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: control
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: control
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: worker-tls
          secret:
            secretName: gometer-worker-tls
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gometer-workers-dashboard-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gometer-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gometer-dashboard
      ports:
        - protocol: TCP
          port: 8801
