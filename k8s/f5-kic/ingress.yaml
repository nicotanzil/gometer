apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gometer-dashboard
  annotations:
    nginx.org/policies: gometer-dashboard-vpn
    nginx.org/redirect-to-https: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gometer.example.internal
      secretName: gometer-dashboard-tls
  rules:
    - host: gometer.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gometer-dashboard
                port:
                  number: 8790
