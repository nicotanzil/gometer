apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gmeter-dashboard
  annotations:
    nginx.org/policies: gmeter-dashboard-vpn
    nginx.org/redirect-to-https: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gmeter.example.internal
      secretName: gmeter-dashboard-tls
  rules:
    - host: gmeter.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gmeter-dashboard
                port:
                  number: 8790
