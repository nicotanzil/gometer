name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Choose build version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Expected a tag such as v0.1.1."
              exit 1
            fi
            version="${REF_NAME#v}"
          else
            version="0.0.0-dev"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check source
        run: make check

      - name: Verify workspace persistence and authentication
        run: make test-workspace

      - name: Build packages and checksums
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          packages="$GITHUB_WORKSPACE/bin/release/packages"
          mkdir -p "$packages"

          for target in darwin/arm64 linux/amd64 windows/amd64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            build_dir="$RUNNER_TEMP/gometer-${target_os}-${target_arch}"
            executable="gometer"
            if [[ "$target_os" == "windows" ]]; then
              executable="gometer.exe"
            fi
            mkdir -p "$build_dir"

            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build \
              -trimpath \
              -ldflags="-X gometer/internal/cli.Version=$VERSION" \
              -o "$build_dir/$executable" ./cmd/gometer

            archive="gometer_${VERSION}_${target_os}_${target_arch}"
            if [[ "$target_os" == "windows" ]]; then
              (cd "$build_dir" && zip "$packages/$archive.zip" "$executable")
            else
              tar -czf "$packages/$archive.tar.gz" -C "$build_dir" "$executable"
            fi
          done

          actual_version="$("$RUNNER_TEMP/gometer-linux-amd64/gometer" version)"
          [[ "$actual_version" == "GoMeter $VERSION" ]]
          echo "$actual_version"

          cd "$packages"
          sha256sum *.tar.gz *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gometer-packages-${{ steps.version.outputs.value }}
          path: bin/release/packages/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "GoMeter $TAG_NAME"
          )
          notes_file="docs/releases/${TAG_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            release_args+=(--notes-file "$notes_file")
          else
            release_args+=(--generate-notes)
          fi
          gh release create "$TAG_NAME" bin/release/packages/* "${release_args[@]}"
